[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
markers =
    blackbox: Black box testing marks
    whitebox: White box testing marks
    integration: Integration tests
    unit: Unit tests
    slow: Slow running tests
asyncio_mode = auto
